        list:
          collapsible:
            collapsed: false
            summary: "Post {index}"
        fields:
          - name: image
            label: Photo
            component: photo-file
            required: true
            description: "Shown square, at least 800 pixels wide. The grid shows the first posts in this list: drag a new one up. Over 3 MB? Shrink it first at layerssuperfoodbar.com/photo-prep."
          - name: alt
            component: alt-text
            required: true
          - name: post_url
            label: Instagram post link
            type: string
            required: true
            description: "On Instagram, open the post, tap ⋯ → Copy link, and paste it here."
            pattern:
              regex: '^\s*https://(www\.)?instagram\.com/(p|reel|reels|tv)/[A-Za-z0-9_-]+/?(\?\S*)?\s*$'
              message: "This should be a link to an Instagram post, like https://www.instagram.com/p/…/"
      - name: heading
        label: Heading
        type: string
        required: true
      - name: count
        label: Number of posts
        type: number
        default: 4
        description: "How many posts the grid shows, from 1 to 12."
        options:
          min: 1
          max: 12
      - name: mode
        label: Posts to show
        type: select
        default: curated
        description: "Automatic shows your latest posts once your website developer has set up Behold. If it stops working, the hand-picked posts show instead."
        options:
          values:
            - {name: curated, label: Hand-picked posts (above)}
            - {name: auto, label: Automatic (latest posts)}
      - name: behold_feed_url
        label: Behold feed link
        type: string
        description: "Optional — only for Automatic: the link your website developer gives you, starting with https://feeds.behold.so/."
        pattern:
          regex: '^\s*$|^\s*https://feeds\.behold\.so/[A-Za-z0-9_-]+/?\s*$'
          message: "This should be a Behold feed link, starting with https://feeds.behold.so/"
      - name: enabled
        label: Show the Instagram section
        type: boolean
        default: true
        description: "The grid of Instagram posts on the homepage, before the Visit section."

  # ======================= Business details =======================
  - name: site
    label: Business details
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: business
        label: Address and contact
        type: object
        fields:
          - {name: name, label: Name, type: string, required: true}
          - {name: street, label: Street address, type: string, required: true}
          - {name: city, label: City, type: string, required: true}
          - {name: region, label: State, type: string, required: true}
          - {name: postal_code, label: ZIP code, type: string, required: true}
          - name: cross_streets
            label: Cross streets
            type: string
            description: "Optional — shown under the address on the Visit page, for example Between Telegraph Ave and Dana St."
          - name: phone
            label: Phone
            type: string
            description: "Optional — shown in the footer, for example (510) 555-0123."
            pattern:
              regex: '^$|^\+?[0-9\s().-]{7,20}$'
              message: "Use digits, for example (510) 555-0123."
          - name: public_email
            label: Public email
            type: string
            description: "Optional — shown in the footer. A public address only, never the catering inbox."
            pattern:
              regex: '^$|^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$'
              message: "This doesn’t look like an email address."
      - name: ordering
        label: Ordering links
        type: object
        fields:
          - name: square_url
            label: Square store link
            component: web-link
            required: true
            description: "Every Order button on the site opens this."
          - name: doordash_url
            label: DoorDash link
            component: web-link
            description: "Optional — shown on the Visit page and the link-in-bio page."
          - name: ubereats_url
            label: Uber Eats link
            component: web-link
            description: "Optional — shown on the Visit page and the link-in-bio page."
      - name: social
        label: Social media
        type: object
        description: "Optional — each one shows in the footer once it’s filled in."
        fields:
          - name: instagram_handle
            label: Instagram handle
            type: string
            description: "Just the name, without @ — for example layerssuperfoodbar."
            pattern:
              regex: '^$|^@?[A-Za-z0-9._]{1,30}$'
              message: "Write just the name, for example layerssuperfoodbar — no @ or web address."
          - {name: tiktok_url, label: TikTok link, component: web-link}
          - {name: facebook_url, label: Facebook link, component: web-link}
          - {name: yelp_url, label: Yelp link, component: web-link}
          - {name: google_url, label: Google link, component: web-link}
      - name: footer_tagline
        label: Footer tagline
        type: string
        required: true
        description: "The line beside the logo in the footer of every page."
      - name: signoff_tagline
        label: Sign-off tagline
        type: string
        required: true
        description: "The line in the big sign-off at the bottom of every page."
      - name: seo
        label: Google and shared links
        type: object
        fields:
          - name: default_description
            label: Default Google description
            type: text
            required: true
            description: "Used by pages without a Google description of their own, like the link-in-bio page. About 160 characters."
          - name: share_image
            label: Photo for shared links
            component: photo-file
            description: "Optional — shown when the site is shared in a message. Empty = the homepage photo. Wide works best. Over 3 MB? Shrink it first at layerssuperfoodbar.com/photo-prep."
      # Set up by the developer (docs/SETUP.md §5); hidden so it can't be
      # changed by accident. Still declared, so a save keeps it.
      - name: analytics
        label: Analytics
        type: object
        hidden: true
        fields:
          - name: cloudflare_web_analytics_token
            label: Cloudflare Web Analytics token
            type: string
            pattern:
              regex: '^$|^[0-9a-fA-F]{32}$'
              message: "A Cloudflare Web Analytics token is 32 letters and numbers (0–9, a–f)."

# ---------------------------------------------------------------------------
# Buttons in the CMS sidebar. Each starts a workflow in .github/workflows/ on
# main; the workflows check the request themselves (CMS_SPEC §8.10), because
# Pages CMS doesn't.
# ---------------------------------------------------------------------------
actions:
  - name: publish-now
    label: Publish now
    workflow: build-deploy.yml
    ref: main
    confirm:
      title: Publish the website now?
      message: "Rebuilds the website from everything that’s saved and puts it live in a few minutes. Saving already does this by itself — use this if the site looks out of date. If something needs fixing, you’ll get a message saying what, and the live site stays as it was."
      button: Publish now
  - name: refresh-menu
    label: Refresh menu from Square
    workflow: menu-refresh.yml
    ref: main
    confirm:
      title: Refresh the menu from Square?
      message: "Gets the latest items and prices from Layers’ Square store and republishes the menu. Your names, notes, photos and hidden items on the website are kept; new Square items are added at the end of the menu list."
      button: Refresh menu
  - name: back-up-now
    label: Back up now
    workflow: backup.yml
    ref: main
    confirm:
      title: Make a backup now?
      message: "Saves a copy of all the website’s words and photos. Backups are also made every Sunday, and the newest 12 are kept."
      button: Back up now
  - name: restore-backup
    label: Restore a backup
    workflow: restore.yml
    ref: main
    cancelable: false
    confirm:
      title: Restore the website from a backup?
      message: "Puts all the website’s words and photos back the way they were in that backup, then republishes the site. Changes made since then are replaced. Type “latest” for the newest backup, a backup’s name (like backup-2026-11-01-0423), or a date (like 2026-11-01) for the newest backup from that day. The list of backups is on the website’s GitHub page, under Releases."
      button: Restore
    fields:
      - name: backup                    # read by tools/ci/payload.py as inputs.backup
        label: Backup name
        type: text
        required: true
        default: latest
  - name: undo-last-change
    label: Undo my last change
    workflow: undo.yml
    ref: main
    cancelable: false
    confirm:
      title: Undo the last change?
      message: "Takes back the most recent saved change to the website’s words or photos — only that one — and republishes the site."
      button: Undo
