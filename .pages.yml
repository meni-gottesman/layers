      # A new page needs only its title and web address. What the page is
      # (Published, title, address, where it's linked, its name in the main
      # menu) comes first, then what's on it, then Google.
      - name: custom-pages
        label: Your own pages
        type: collection
        path: content/custom-pages
        format: json
        subfolders: false
        filename:
          template: "{fields.address}.json"   # must end in .json (Pages CMS bug #413)
          field: false
        operations:
          rename: false                         # the file name is the page's web address
        view:
          primary: title
          fields: [title, address, published]
          sort: [title]
          default:
            sort: title
            order: asc
        fields:
          - name: published
            label: Published
            type: boolean
            default: true
            description: "Switch off to take the page off the website. It stays here as a draft."
          - name: title
            label: Page title
            type: string
            required: true
            description: "The big heading at the top, and the page’s name in the menus. Short is best."
          - name: address
            label: Web address
            type: string
            required: true
            description: "For example summer-menu, for layerssuperfoodbar.com/summer-menu: lowercase letters, numbers and dashes, and not one your other pages use. Fixed at the first Save."
            pattern:
              regex: '^(?!(?:menu|story|how-we-make-it|what-you-get|day-in-the-life|catering|faq|visit|gift-cards|loyalty|links|photo-prep|brand|edit|order|404|index|home|api|assets|cdn-cgi|admin|layers|sitemap|robots|favicon)$)[a-z0-9]+(?:-[a-z0-9]+)*$'
              message: "Use only lowercase letters, numbers and dashes, with no spaces — for example summer-menu. A few words belong to the site’s own pages (menu, story, visit, catering, faq …): choose another."
          - name: show_in
            label: Show it in
            type: select
            default: footer
            description: "Where the website links to this page. The main menu has room for 2 of your pages (the first in A–Z order); any more go in the footer."
            options:
              values:
                - {name: footer, label: Footer only}
                - {name: menu, label: Main menu and footer}
                - {name: none, label: "Nowhere (just the link)"}
          - name: menu_title
            label: Name in the menu
            type: string
            description: "Optional — a shorter name for the main menu, up to 18 characters, for example Run Club. Empty = the page title."
            options:
              maxlength: 18
          - name: intro
            label: Short intro
            type: text
            description: "Optional — a sentence or two under the title."
          - name: photo
            label: Top photo
            component: draft-photo
            description: "Optional — a wide photo under the title: a big landscape photo, at least 1,200 pixels wide."
          - name: sections
            component: more-sections
          - name: google_title
            label: Google title
            type: string
            description: "Optional — the page’s headline in Google and on the browser tab. Empty = the page title. About 60 characters."
          - name: google_description
            label: Google description
            type: text
            description: "Optional — one or two sentences under the headline in Google, about 160 characters. Empty = the website’s default."

  # ======================= Photo albums =======================
  - name: albums
    label: Photo albums
    type: collection
    path: content/albums
    format: json
    subfolders: false
    filename:
      template: "{fields.title}.json"     # must end in .json (Pages CMS bug #413)
      field: false
    operations:
      rename: false                       # the file name is the album's address and photo folder
    view:
      primary: title
      fields: [title, order, published]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: published
        label: Published
        type: boolean
        default: true
        description: "Switch off to take the album off the website. It stays here as a draft."
      - name: title
        label: Title
        type: string
        required: true
        description: "For example Summer pop-ups. The albums are on the “A Day at Layers” page."
        pattern:
          regex: '[A-Za-z0-9]'
          message: "Use at least one letter or number (A–Z, 0–9): the name becomes the web address."
      - name: photos
        label: Photos
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "Photo {index}"
        fields:
          - name: image
            label: Photo
            component: photo-file
            required: true
            description: "At least 800 pixels wide. Drag photos by their grip to change the order. Over 3 MB? Shrink it first at layerssuperfoodbar.com/photo-prep."
          - name: alt
            component: alt-text
            required: true
      - name: cover
        label: Cover photo
        component: photo-file
        description: "Optional — the photo on the album’s tile, cut tall. Empty = the first photo. Over 3 MB? Shrink it first at layerssuperfoodbar.com/photo-prep."
      - name: cover_focus
        label: Cover focus
        component: photo-focus
        description: "Optional — which part of the cover photo to keep when it’s trimmed to fit."
      - name: order
        label: Position
        type: number
        default: 99
        description: "Optional — albums are shown smallest number first. New albums start at 99 (last); 0 puts one first."
        options:
          min: 0
          max: 999

