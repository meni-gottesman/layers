# Pages CMS configuration for the Layers Superfood Bar website.
#
# Pages CMS (app.pagescms.org, v2.1.8) is how the marketing manager edits
# content/. tests/test_cms_schema.py checks this file against tools/content.py
# and the content files; docs/dev/CMS.md explains how it is organised and how
# to add a field safely. The rules that matter most:
#
#   * A CMS save rewrites the WHOLE file from the fields below: a key that is
#     not declared here is deleted, and empty values ("", [], {}) are dropped.
#     So every key the site reads must be declared here, with the label it has
#     in tools/content.py (the validator's messages use the same words).
#     To keep a key out of sight, use `hidden: true` — never leave it out.
#   * Field order here is the key order in the saved file. After changing
#     this file, run `python3 tools/cms_normalize.py` so the files match.
#   * `required`, `options.maxlength`, list min/max and patterns stop a save
#     in the CMS. Use them only for rules tools/content.py treats as errors;
#     soft limits ("about 60 characters") go in the description. Files that
#     can be saved as unfinished drafts (Gift Cards, Loyalty, and the specials,
#     events and albums) only require their name, so a draft can be saved.
#   * A list field's description is never shown (and would repeat under every
#     item): describe the fields inside the list instead.
#   * Quote anything YAML 1.1 and 1.2 read differently (times like 09:00,
#     dates, yes/no/on/off): Pages CMS reads YAML 1.2, the tests read 1.1.
#
# Written for someone with no technical background (docs/dev/CMS.md, "Form
# order and wording"):
#
#   * Each form starts with what is changed most. In a collection the
#     "Published" switch comes first (switching it off is how something is
#     taken down). "More sections" follows the page's own fields; what is
#     rarely needed comes last — the film's spoken texts, "Google and shared
#     links", and switches that take a whole page or section off the site.
#     Inside a photo spot: Photo, Photo description, then Focus and Zoom.
#   * Labels are everyday words: "Photo description" (not alt text), "Google
#     title" (not SEO), "Order button text" for the words on a button.
#   * Help text is one short sentence, with an example where it helps. A box
#     that can be left empty says so first ("Optional — …"), unless its help
#     says when it's needed (a link goes with its link text, a photo's
#     description with its photo); a required one shows the CMS's "Required"
#     badge.

media:
  - name: photos
    label: Photos
    input: src-img                      # every photo the site uses lives under src-img/
    output: src-img                     # written into content as "src-img/uploads/x.jpg"
    extensions: [jpg, jpeg, png, webp]  # HEIC isn't an image type in Pages CMS
    rename: safe                        # "IMG 1234.JPG" -> "img-1234.jpg" (lower-case extension)

settings:
  content:
    merge: false                        # explicit: a save rewrites the file from this schema only

# ---------------------------------------------------------------------------
# Building blocks used by the fields below (`component: <name>`). A field's
# own keys win over the component's, so a field can change the label,
# description or `required`.
# ---------------------------------------------------------------------------
components:
  # 24-hour time as a checked string: the CMS's date-time field would store a
  # date too. Same rule as the validator (tools/content.py Time). Spaces
  # around the time are allowed, as for links: a phone keyboard easily adds
  # one after "17:00", and the build trims it (content.Time.normalise).
  time-24h:
    type: string
    pattern:
      regex: '^\s*$|^\s*([01][0-9]|2[0-3]):[0-5][0-9]\s*$'
      message: "Use the 24-hour clock, for example 09:00 or 18:30 (6:30 pm)."

  # A calendar date stored as YYYY-MM-DD. default "" keeps a new date empty
  # (without it the CMS fills in today's date).
  calendar-date:
    type: date
    default: ""
    options:
      format: yyyy-MM-dd

  # Most photo fields give their own description (the spot's shape); each one
  # ends with the same reminder about the upload limit (CMS_SPEC §8.8), with
  # the whole address: the CMS shows help as plain text, not as a link.
  photo-file:
    type: image
    description: "Press Upload, or Select a photo that’s already on the website. Over 3 MB? Shrink it first at layerssuperfoodbar.com/photo-prep."
    options:
      media: photos
      path: src-img/uploads             # where the picker opens and uploads land

  photo-focus:
    type: select
    label: Focus
    default: auto
    description: "Optional — which part to keep when the photo is trimmed to fit. Automatic suits most photos."
    options:
      values:
        - {name: auto, label: Automatic}
        - {name: top, label: Top}
        - {name: bottom, label: Bottom}
        - {name: left, label: Left}
        - {name: right, label: Right}
        - {name: top-left, label: Top left}
        - {name: top-right, label: Top right}
        - {name: bottom-left, label: Bottom left}
        - {name: bottom-right, label: Bottom right}

  photo-zoom:
    type: select
    label: Zoom
    default: auto
    description: "Optional — crop in closer. Automatic (no zoom) suits most photos."
    options:
      values:
        - {name: auto, label: Automatic}
        - {name: none, label: No zoom}
        - {name: a-little, label: A little closer}
        - {name: more, label: Closer}

  alt-text:
    type: string
    label: Photo description
    description: "For people who can’t see the photo (it’s read aloud to them): a few words on what’s in it, for example Two friends toasting with Layers smoothies outside the shop."
    options:
      maxlength: 250

  # Links. Same rules as the validator (tools/content.py url_ok). Pages CMS
  # doesn't trim what's typed and a pasted link often brings a space or line
  # break along, so spaces around the link are allowed (the build trims them,
  # content.Url.normalise) — only spaces inside it are refused.
  web-link:
    type: string
    pattern:
      regex: '^\s*$|^\s*https://[^\s/$.?#]\S*\s*$'
      message: "Use the full web address, starting with https:// (no spaces inside it)."
  site-link:
    type: string
    pattern:
      regex: '^\s*$|^\s*(https://[^\s/$.?#]\S*|#\S*|/(?![/\\])\S*)\s*$'
      message: "Use a full web address starting with https://, or a page on this site starting with / (for example /menu) — no spaces inside it."

  # Text with the site's small formatting set (tools/textfmt.py).
  formatted-text:
    type: text
    description: "Leave a blank line between paragraphs. **bold**, *italic* and links like [the menu](/menu) work."

  # A photo spot on a page: the photo, its description and how it's cropped.
  # The -draft versions require nothing, for pages that may be unfinished.
  page-photo:
    type: object
    fields:
      - {name: image, component: photo-file, label: Photo, required: true}
      - {name: alt, component: alt-text, required: true}
      - {name: focus, component: photo-focus}
      - {name: zoom, component: photo-zoom}
  page-photo-no-alt:
    type: object
    fields:
      - {name: image, component: photo-file, label: Photo, required: true}
      - {name: focus, component: photo-focus}
      - {name: zoom, component: photo-zoom}
  draft-photo:
    type: object
    fields:
      - {name: image, component: photo-file, label: Photo}
      - {name: alt, component: alt-text}
      - {name: focus, component: photo-focus}
      - {name: zoom, component: photo-zoom}
  draft-photo-no-alt:
    type: object
    fields:
      - {name: image, component: photo-file, label: Photo}
      - {name: focus, component: photo-focus}
      - {name: zoom, component: photo-zoom}

  # How a page shows up in Google and in shared links: last on every page.
  seo:
    type: object
    label: Google and shared links
    description: "How this page looks in Google and when someone shares a link to it. You rarely need to change it."
    fields:
      - name: title
        label: Google title
        type: string
        required: true
        description: "The headline in Google and on the browser tab. About 60 characters."
      - name: description
        label: Google description
        type: text
        required: true
        description: "One or two sentences under the headline. About 160 characters."
  seo-optional-description:
    type: object
    label: Google and shared links
    description: "How this page looks in Google and when someone shares a link to it. You rarely need to change it."
    fields:
      - name: title
        label: Google title
        type: string
        required: true
        description: "The headline in Google and on the browser tab. About 60 characters."
      - name: description
        label: Google description
        type: text
        description: "Optional — one or two sentences under the headline. About 160 characters."
  seo-draft:
    type: object
    label: Google and shared links
    description: "How this page looks in Google and when someone shares a link to it. You rarely need to change it."
    fields:
      - name: title
        label: Google title
        type: string
        description: "The headline in Google and on the browser tab. About 60 characters."
      - name: description
        label: Google description
        type: text
        description: "One or two sentences under the headline. About 160 characters."

  # "More sections": sections the manager adds to a page herself, drawn after
  # the page's own content in the site's own style (tools/content.py
  # SECTION_BLOCKS, templates/partials/sections.html). A Pages CMS block
  # list: "Add an item" asks which kind of section, and the kind is saved as
  # `type` (blockKey). The six kinds and their fields must match content.py
  # (tests/test_cms_schema.py checks). Field descriptions repeat under every
  # section, so they are kept short.
  more-sections:
    type: block
    label: More sections
    blockKey: type
    list:
      collapsible:
        collapsed: true
        summary: "Section {index}"
    blocks:
      - name: text
        label: Text
        fields:
          - name: heading
            label: Heading
            type: string
            description: "Optional — big letters, like the chapter titles on the story page."
          - name: text
            label: Text
            component: formatted-text
          - name: eyebrow
            label: Small label above the heading
            type: string
            description: "Optional — a few words in small green letters, for example New this fall."
      - name: photo
        label: Photo
        fields:
          - name: image
            label: Photo
            component: photo-file
            required: true
            description: "A landscape photo works best (Wide needs one at least 1,200 pixels wide). Over 3 MB? Shrink it first at layerssuperfoodbar.com/photo-prep."
          - {name: alt, component: alt-text, required: true}
          - name: size
            label: Size
            type: select
            default: wide
            options:
              values:
                - {name: wide, label: "Wide (across the whole page)"}
                - {name: standard, label: "Standard (centred, with space around it)"}
          - name: caption
            label: Caption
            type: string
            description: "Optional — a short line under the photo, up to 80 characters."
            options:
              maxlength: 80
          - {name: focus, component: photo-focus}
          - {name: zoom, component: photo-zoom}
      - name: photo-text
        label: Photo and text
        fields:
          - name: image
            label: Photo
            component: photo-file
            required: true
            description: "Shown tall beside the text: a portrait photo works best. Over 3 MB? Shrink it first at layerssuperfoodbar.com/photo-prep."
          - {name: alt, component: alt-text, required: true}
          - name: heading
            label: Heading
            type: string
            required: true
          - name: text
            label: Text
            component: formatted-text
          - name: button_label
            label: Button text
            type: string
            description: "Optional — the words on a button under the text, for example See the menu."
          - name: button_link
            label: Button link
            component: site-link
            description: "Where the button goes: a page on this site, like /menu, or a full web address."
          - name: photo_side
            label: Photo side
            type: select
            default: left
            options:
              values:
                - {name: left, label: Photo on the left}
                - {name: right, label: Photo on the right}
          - {name: focus, component: photo-focus}
          - {name: zoom, component: photo-zoom}
      - name: photos
        label: Row of photos
        fields:
          - name: photos
            label: Photos
            type: object
            list:
              min: 2
              max: 4
              collapsible:
                collapsed: false
                summary: "Photo {index}"
            fields:
              - name: image
                label: Photo
                component: photo-file
                required: true
                description: "Two to four photos side by side, cut square. Over 3 MB? Shrink it first at layerssuperfoodbar.com/photo-prep."
              - {name: alt, component: alt-text, required: true}
              - {name: focus, component: photo-focus}
              - {name: zoom, component: photo-zoom}
      - name: button
        label: Button
        fields:
          - name: label
            label: Button text
            type: string
            required: true
            description: "The words on the button, for example Order on Square. Keep it short."
          - name: link
            label: Link
            component: site-link
            required: true
            description: "Where it goes: a page on this site, like /menu, or a full web address."
          - name: style
            label: Colour
            type: select
            default: green
            options:
              values:
                - {name: green, label: Green}
                - {name: outline, label: "Outline (a green line)"}
      - name: quote
        label: Quote
        fields:
          - name: quote
            label: Quote
            type: text
            required: true
            description: "The words, without quotation marks (the site adds them). A sentence or two reads best."
          - name: name
            label: Who said it
            type: string
            description: "Optional — for example a customer’s first name."

# ---------------------------------------------------------------------------
# What the manager edits, in sidebar order.
# ---------------------------------------------------------------------------
content:

  # ======================= This week =======================
  - name: this-week
    label: This week
    type: group
    items:

      - name: announcement
        label: Announcement bar
        type: file
        path: content/announcement.json
        format: json
        operations:
          delete: false
        fields:
          - name: enabled
            label: Show the bar
            type: boolean
            default: false
            description: "Switch on to show the bar at the top of every page (between the dates below, if you set any)."
          - name: message
            label: Message
            type: string
            description: "Up to 110 characters, for example Open late this Friday."
            options:
              maxlength: 110
          - name: starts
            label: First day shown
            component: calendar-date
            description: "Optional — empty means straight away."
          - name: ends
            label: Last day shown
            component: calendar-date
            description: "Optional — empty means until you switch the bar off."
          - name: link_label
            label: Link text
            type: string
            description: "Optional — the words people tap after the message, for example See the menu."
          - name: link_url
            label: Link
            component: site-link
            description: "Where the link goes: a page on this site, like /menu, or a full web address."
          - name: tone
            label: Colour
            type: select
            default: green
            options:
              values:
                - {name: green, label: Green}
                - {name: butter, label: "Light (cream, with a green line)"}

      - name: specials
        label: Specials
        type: collection
        path: content/specials
        format: json
        subfolders: false
        filename:
          template: "{fields.name}.json"   # must end in .json, or entries vanish (Pages CMS bug #413)
          field: false
        operations:
          rename: false                    # the file name is the special's web address and photo name
        view:
          primary: name
          fields: [name, published, starts, ends]
          sort: [name, starts]
          default:
            sort: name
            order: asc
        fields:
          - name: published
            label: Published
            type: boolean
            default: true
            description: "Switch off to take it off the website. It stays here, ready for next time."
          - name: name
            label: Name
            type: string
            required: true
            description: "The drink or bowl’s name, for example Phi Velvet."
            pattern:
              regex: '[A-Za-z0-9]'
              message: "Use at least one letter or number (A–Z, 0–9): the name becomes the web address."
          - name: image
            label: Photo
            component: photo-file
            description: "Optional — a tall (portrait) photo works best, at least 800 pixels wide. Over 3 MB? Shrink it first at layerssuperfoodbar.com/photo-prep."
          - name: image_alt
            component: alt-text
          - name: tagline
            label: Tagline
            type: string
            description: "Optional — one short line under the name, for example Strong. Radiant. Nourished."
          - name: description
            label: Description
            component: formatted-text
            description: "Optional — a few sentences. **bold**, *italic* and links like [the menu](/menu) work."
          - name: starts
            label: First day shown
            component: calendar-date
            description: "Optional — empty means straight away."
          - name: ends
            label: Last day shown
            component: calendar-date
            description: "Optional — it disappears by itself the day after. Empty means until you switch off Published."
          - name: order_button
            label: Order button
            type: select
            default: none
            description: "“No button” is right for a special that isn’t on Square."
            options:
              values:
                - {name: none, label: No button (in store only)}
                - {name: square, label: Order on Square}
                - {name: link, label: Order (to the order link below)}
          - name: availability_note
            label: Note instead of a button
            type: string
            default: In store for a limited time.
            description: "Shown when the order button is “No button”. Keep it short."
          - name: order_url
            label: Order link
            component: web-link
            description: "Only for “Order (to the order link below)”: the full web address, starting with https://."
          - name: price
            label: Price
            type: string
            description: "Optional — write it like 9.50. Leave it empty if it isn’t sold on Square."
            pattern:
              regex: '^$|^\$?[0-9]{1,3}(\.[0-9]{2})?$'
              message: "Write the price like 9.50 (or leave it empty)."
          - name: partner
            label: Made with (partner)
            type: string
            description: "Optional — shown as “Made with …”, for example Cal Alpha Phi."
          - name: badge
            label: Small label above the name
            type: string
            description: "Optional — a word or two above the name. Empty = Limited time."
          - name: highlights             # `required` on a list would demand at least one item
            label: Highlights
            type: string
            list: true
          - name: ingredients
            label: Ingredients
            type: text
            description: "Optional — separated by commas, for example Strawberry, Banana, Almond milk."
          - name: show_on_home
            label: Show on the homepage
            type: boolean
            default: true
          - name: show_on_menu
            label: Show on the menu
            type: boolean
            default: true

      - name: events
        label: Events
        type: collection
        path: content/events
        format: json
        subfolders: false
        filename:
          template: "{fields.date}-{fields.title}.json"   # must end in .json (Pages CMS bug #413)
          field: false
        operations:
          rename: false
        view:
          primary: title
          fields: [title, date, published]
          sort: [date, title]
          default:
            sort: date
            order: desc
        fields:
          - name: published
            label: Published
            type: boolean
            default: true
            description: "Switch off to take it off the website. It stays here as a draft."
          - name: title
            label: Title
            type: string
            required: true
            description: "For example Saturday run club."
            pattern:
              regex: '[A-Za-z0-9]'
              message: "Use at least one letter or number (A–Z, 0–9): the name becomes the web address."
          - name: date
            label: Date
            component: calendar-date
            required: true
            description: "Shown under “Coming up” on the homepage and the link-in-bio page until the day has passed."
          - name: start_time
            label: Start time
            component: time-24h
            description: "Optional — 24-hour clock, for example 09:00 (or 18:30 for 6:30 pm)."
          - name: end_time
            label: End time
            component: time-24h
            description: "Optional — for example 10:30."
          - name: location
            label: Location
            type: string
            description: "Optional — for example Layers, 2436 Channing Way."
          - name: description
            label: Description
            component: formatted-text
            description: "Optional — a few sentences. **bold**, *italic* and links like [the menu](/menu) work."
          - name: link_label
            label: Link text
            type: string
            description: "Optional — the words people tap, for example Sign up."
          - name: link_url
            label: Link
            component: site-link
            description: "Where to sign up or read more: a full web address or a page on this site."
          - name: partner
            label: With (partner)
            type: string
            description: "Optional — shown as “With …”."
          - name: image
            label: Photo
            component: photo-file
            description: "Optional — shown as a small square, at least 800 pixels wide. Over 3 MB? Shrink it first at layerssuperfoodbar.com/photo-prep."
          - name: image_alt
            component: alt-text

      - name: hours
        label: Opening hours
        type: file
        path: content/hours.json
        format: json
        operations:
          delete: false
        fields:
          # Holidays come first: they're changed far more often than the weekly hours.
          - name: special
            label: Special hours
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{date} {label}"
            fields:
              - name: date
                label: Date
                component: calendar-date
                required: true
                description: "A holiday or other one-off day: these hours replace the weekly hours on this date."
              - name: label
                label: Name
                type: string
                description: "For example Thanksgiving."
              - name: closed
                label: Closed all day
                type: boolean
                default: false
              - name: open
                label: Opens
                component: time-24h
                description: "24-hour clock, for example 10:00 (or 14:30 for 2:30 pm)."
              - name: close
                label: Closes
                component: time-24h
          - name: weekly
            label: Weekly hours
            type: object
            description: "Used all over the site and in Google. The times use the 24-hour clock: 18:00 is 6 pm."
            fields:
              - name: monday
                label: Monday
                type: object
                fields:
                  - {name: closed, label: Closed all day, type: boolean, default: false}
                  - {name: open, label: Opens, component: time-24h}
                  - {name: close, label: Closes, component: time-24h}
              - name: tuesday
                label: Tuesday
                type: object
                fields:
                  - {name: closed, label: Closed all day, type: boolean, default: false}
                  - {name: open, label: Opens, component: time-24h}
                  - {name: close, label: Closes, component: time-24h}
              - name: wednesday
                label: Wednesday
                type: object
                fields:
                  - {name: closed, label: Closed all day, type: boolean, default: false}
                  - {name: open, label: Opens, component: time-24h}
                  - {name: close, label: Closes, component: time-24h}
              - name: thursday
                label: Thursday
                type: object
                fields:
                  - {name: closed, label: Closed all day, type: boolean, default: false}
                  - {name: open, label: Opens, component: time-24h}
                  - {name: close, label: Closes, component: time-24h}
              - name: friday
                label: Friday
                type: object
                fields:
                  - {name: closed, label: Closed all day, type: boolean, default: false}
                  - {name: open, label: Opens, component: time-24h}
                  - {name: close, label: Closes, component: time-24h}
              - name: saturday
                label: Saturday
                type: object
                fields:
                  - {name: closed, label: Closed all day, type: boolean, default: false}
                  - {name: open, label: Opens, component: time-24h}
                  - {name: close, label: Closes, component: time-24h}
              - name: sunday
                label: Sunday
                type: object
                fields:
                  - {name: closed, label: Closed all day, type: boolean, default: false}
                  - {name: open, label: Opens, component: time-24h}
                  - {name: close, label: Closes, component: time-24h}
          - name: note
            label: Note under the hours
            type: string
            description: "Optional — a short line under the hours table on the Visit page."

  # ======================= Menu =======================
  # The items come first: hiding, renaming and re-photographing items is what
  # this screen is for. The words around the menu follow them.
  - name: menu
    label: Menu
    type: file
    path: content/menu.json
    format: json
    operations:
      delete: false
    fields:
      - name: items
        label: Menu items
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{category} · {square_name}"
        fields:
          # Written by the menu refresh from Square (tools/sync-menu-from-store.py
          # writes new items in this key order); read-only here. The list's
          # order is the order on the menu, within each category.
          - name: square_name
            label: Name on Square
            type: string
            readonly: true
            description: "Comes from Square. Drag an item by its grip to move it on the menu."
          - name: display_name
            label: Name on the website
            type: string
            description: "Optional — a different name for the website only. Empty = the name on Square. About 40 characters at most."
          - name: note
            label: Note under the name
            type: string
            description: "Optional — a short line, for example Classic Açaí."
          - name: photo
            label: Photo
            component: photo-file
            description: "Optional — your own photo instead of Square’s, shown square, at least 800 pixels wide. Over 3 MB? Shrink it first at layerssuperfoodbar.com/photo-prep."
          - name: hidden
            label: Hide from the website
            type: boolean
            default: false
            description: "Takes the item off the website’s menu; it stays on Square. Use this instead of deleting the item."
          - name: focus
