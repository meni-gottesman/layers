  # ======================= Photo albums =======================
  - name: albums
    label: Photo albums
    type: collection
    path: content/albums
    format: json
    subfolders: false
    filename:
      template: "{fields.title}.json"     # must end in .json (Pages CMS bug #413)
      field: false
    operations:
      rename: false                       # the file name is the album's address and photo folder
    view:
      primary: title
      fields: [title, order, published]
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "The albums are on the “A Day at Layers” page. About 40 characters at most. It becomes the album’s web address, so it needs letters or numbers (not only emoji)."
        pattern:
          regex: '[A-Za-z0-9]'
          message: "Use at least one letter or number (A–Z, 0–9): the name becomes the web address."
      - name: order
        label: Position
        type: number
        default: 99
        description: "Albums are shown smallest number first."
        options:
          min: 0
          max: 999
      - name: published
        label: Published
        type: boolean
        default: true
        description: "Switch off to keep this album as a draft that isn’t on the site."
      - name: cover
        label: Cover photo
        component: photo-file
        description: "The photo on the album’s tile, cropped tall (4:5). Empty = the first photo. Photos over about 3 MB can’t be uploaded — make them smaller first on the website’s /photo-prep page."
      - name: cover_focus
        label: Cover focus
        component: photo-focus
      - name: photos
        label: Photos
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "Photo {index}"
        fields:
          - name: image
            label: Photo
            component: photo-file
            required: true
            description: "At least 800 pixels wide. Drag photos to change their order. Photos over about 3 MB can’t be uploaded — make them smaller first on the website’s /photo-prep page."
          - name: alt
            component: alt-text
            required: true

  # ======================= Instagram =======================
  - name: instagram
    label: Instagram
    type: file
    path: content/instagram.json
    format: json
    operations:
      delete: false
    fields:
      - name: enabled
        label: Show the Instagram section
        type: boolean
        default: true
        description: "A grid of Instagram posts on the homepage, before the Visit section."
      - name: heading
        label: Heading
        type: string
        required: true
      - name: mode
        label: Posts to show
        type: select
        default: curated
        description: "Automatic shows the latest posts from the Behold feed, refreshed once a day. If the feed doesn’t work, the hand-picked posts are shown instead."
        options:
          values:
            - {name: curated, label: Hand-picked posts (below)}
            - {name: auto, label: Automatic (latest posts)}
      - name: behold_feed_url
        label: Behold feed link
        type: string
        description: "Only for Automatic. In Behold, open your feed and copy the JSON link that starts with https://feeds.behold.so/."
        pattern:
          regex: '^\s*$|^\s*https://feeds\.behold\.so/[A-Za-z0-9_-]+/?\s*$'
          message: "This should be a Behold feed link, starting with https://feeds.behold.so/"
      - name: count
        label: Number of posts
        type: number
        default: 4
        description: "How many posts the grid shows, from 1 to 12."
        options:
          min: 1
          max: 12
      - name: curated
        label: Hand-picked posts
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "Post {index}"
        fields:
          - name: image
            label: Photo
            component: photo-file
            required: true
            description: "Shown square, at least 800 pixels wide. Photos over about 3 MB can’t be uploaded — make them smaller first on the website’s /photo-prep page."
          - name: post_url
            label: Instagram post link
            type: string
            required: true
            description: "On Instagram, open the post, tap ⋯ → Copy link, and paste it here."
            pattern:
              regex: '^\s*https://(www\.)?instagram\.com/(p|reel|reels|tv)/[A-Za-z0-9_-]+/?(\?\S*)?\s*$'
              message: "This should be a link to an Instagram post, like https://www.instagram.com/p/…/"
          - name: alt
            component: alt-text
            required: true

  # ======================= Business details =======================
  - name: site
    label: Business details
    type: file
    path: content/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: business
        label: Business
        type: object
        fields:
          - {name: name, label: Name, type: string, required: true}
          - {name: street, label: Street address, type: string, required: true}
          - {name: city, label: City, type: string, required: true}
          - {name: region, label: State, type: string, required: true}
          - {name: postal_code, label: ZIP code, type: string, required: true}
          - name: cross_streets
            label: Cross streets
            type: string
            description: "Optional. Shown under the address on the Visit page, for example Between Telegraph Ave and Dana St."
          - name: phone
            label: Phone
            type: string
            description: "Optional. Shown in the footer when filled in, for example (510) 555-0123."
            pattern:
              regex: '^$|^\+?[0-9\s().-]{7,20}$'
              message: "Use digits, for example (510) 555-0123."
          - name: public_email
            label: Public email
            type: string
            description: "Optional. Shown in the footer when filled in. A public address only — never the catering inbox."
            pattern:
              regex: '^$|^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$'
              message: "This doesn’t look like an email address."
      - name: ordering
        label: Ordering
        type: object
        fields:
          - name: square_url
            label: Square store link
            component: web-link
            required: true
            description: "Every Order button on the site opens this."
          - name: doordash_url
            label: DoorDash link
            component: web-link
            description: "Optional. When filled in, shown on the Visit page and the link-in-bio page."
          - name: ubereats_url
            label: Uber Eats link
            component: web-link
            description: "Optional. When filled in, shown on the Visit page and the link-in-bio page."
      - name: social
        label: Social
        type: object
        description: "Links are shown in the footer when filled in."
        fields:
          - name: instagram_handle
            label: Instagram handle
            type: string
            description: "Just the name, without @ — for example layerssuperfoodbar."
            pattern:
              regex: '^$|^@?[A-Za-z0-9._]{1,30}$'
              message: "Write just the name, for example layerssuperfoodbar — no @ or web address."
          - {name: tiktok_url, label: TikTok link, component: web-link}
          - {name: facebook_url, label: Facebook link, component: web-link}
          - {name: yelp_url, label: Yelp link, component: web-link}
          - {name: google_url, label: Google link, component: web-link}
      - name: seo
        label: SEO
        type: object
        fields:
          - name: default_description
            label: Default description
            type: text
            required: true
            description: "For pages that don’t have a description of their own, like the link-in-bio page: shown by Google and in shared links. Every main page has its own (in its SEO section). About 160 characters."
          - name: share_image
            label: Share image
            component: photo-file
            description: "Optional. Shown when a link to the site is shared, for example in a message. Empty = the homepage photo. A wide photo (1200 × 630) works best."
      - name: footer_tagline
        label: Footer tagline
        type: string
        required: true
      - name: signoff_tagline
        label: Sign-off tagline
        type: string
        required: true
        description: "The line in the big sign-off at the bottom of every page."
      - name: analytics
        label: Analytics
        type: object
        fields:
          - name: cloudflare_web_analytics_token
            label: Cloudflare Web Analytics token
            type: string
            description: "Optional. From Cloudflare → Web Analytics → your site: 32 letters and numbers."
            pattern:
              regex: '^$|^[0-9a-fA-F]{32}$'
              message: "A Cloudflare Web Analytics token is 32 letters and numbers (0–9, a–f)."

# ---------------------------------------------------------------------------
# Buttons in the CMS sidebar. Each starts a workflow in .github/workflows/ on
# main; the workflows check the request themselves (CMS_SPEC §8.10), because
# Pages CMS doesn't.
# ---------------------------------------------------------------------------
actions:
  - name: publish-now
    label: Publish now
    workflow: build-deploy.yml
    ref: main
    confirm:
      title: Publish the website now?
      message: "Rebuilds the website from everything that’s saved and puts it live in a few minutes. Saving already does this by itself — use this if the site looks out of date. If something needs fixing, you’ll get a message saying what, and the live site stays as it was."
      button: Publish now
  - name: refresh-menu
    label: Refresh menu from Square
    workflow: menu-refresh.yml
    ref: main
    confirm:
      title: Refresh the menu from Square?
      message: "Gets the latest items and prices from Layers’ Square store and republishes the menu. Your names, notes, photos and hidden items on the website are kept; new Square items are added at the end of the menu list."
      button: Refresh menu
  - name: back-up-now
    label: Back up now
    workflow: backup.yml
    ref: main
    confirm:
      title: Make a backup now?
      message: "Saves a copy of all the website’s words and photos. Backups are also made every Sunday, and the newest 12 are kept."
      button: Back up now
  - name: restore-backup
    label: Restore a backup
    workflow: restore.yml
    ref: main
    cancelable: false
    confirm:
      title: Restore the website from a backup?
      message: "Puts all the website’s words and photos back the way they were in that backup, then republishes the site. Changes made since then are replaced. Type “latest” for the newest backup, a backup’s name (like backup-2026-11-01-0423), or a date (like 2026-11-01) for the newest backup from that day. The list of backups is on the website’s GitHub page, under Releases."
      button: Restore
    fields:
      - name: backup                    # read by tools/ci/payload.py as inputs.backup
        label: Backup name
        type: text
        required: true
        default: latest
  - name: undo-last-change
    label: Undo my last change
    workflow: undo.yml
    ref: main
    cancelable: false
    confirm:
      title: Undo the last change?
      message: "Takes back the most recent saved change to the website’s words or photos — only that one — and republishes the site."
      button: Undo
