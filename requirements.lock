# Exact versions CI installs (pip install -r requirements.txt -c requirements.lock),
# so a new major release of a library can't stop every publish overnight with
# no change in this repo. Resolved for CI's Python 3.12 on Linux x86_64; every
# pin has a wheel there. requirements.txt keeps the lower bounds for laptops.
#
# To upgrade deliberately: change or delete a pin, run the suite and a build,
# then re-resolve for CI (docs/SETUP.md, "Local commands"):
#   python3 -m pip install --dry-run --ignore-installed --quiet --report lock.json \
#     --python-version 3.12 --platform manylinux_2_28_x86_64 --implementation cp \
#     --only-binary=:all: --target /tmp/lock -r requirements.txt
# and copy each "name version" from lock.json's "install" list here.
