{#- Page not found (content/pages/404.json). Not indexed, not in the sitemap. -#}
{% extends "base.html" %}
{% block main %}

<header class="story-head story-head--inner"{{ edit_attr(edit_page, "Edit the “page not found” words") }}>
  <p class="eyebrow">{{ page.eyebrow }}</p>
  <h1 class="story-head__title story-head__title--long">{{ page.title }}</h1>
{% if page.lede %}
  <p class="story-head__lede">{{ page.lede }}</p>
{% endif %}
  <div class="ed-ctas">
    <a class="btn btn--sage" href="/menu">{{ page.menu_label }}</a>
    <a class="btn btn--line" href="/">{{ page.home_label }}</a>
  </div>
</header>
{% endblock %}
