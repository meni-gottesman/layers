# "Undo my last change" in Pages CMS: revert the most recent change to the
# site's content or photos (content/, the photos in src-img/), then publish
# via build-deploy.yml. Pressing it again goes one more change back. A change
# that also touched anything else (the site's code, src-img/'s crop specs or
# photo manifests) is refused with an explanation. Rules: tools/ci/undo.py.
# Security: CMS_SPEC §8.10 (main only; the payload is read by Python from the
# event file, never printed). No credentials in git's config; only the step
# that saves gets the push token.
name: Undo the last content change

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Filled in by Pages CMS ("Undo my last change"). Leave empty when running by hand.
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  undo:
    name: Undo the last change
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write              # push the undo commit
    concurrency:
      group: layers-undo
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - name: Only run on main
        if: github.ref != 'refs/heads/main'
        run: |
          {
            echo "### This only runs on the main branch"
            echo
            echo "The website publishes from **main**. If you switched branches in Pages CMS, switch back to **main** (the branch menu at the top left) and try again. Nothing was changed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Request refused::This workflow only runs on main."
          exit 1

      # Full history, but file contents only as needed (blob:none): finding
      # the last change reads commits and file lists, not photos.
      - name: Get the site's history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check the request
        id: request
        run: python3 tools/ci/payload.py undo

      - name: Find the last change and reverse it
        id: prepare
        run: python3 tools/ci/undo.py prepare

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock

      - name: Install the build tools
        run: python -m pip install -r requirements.txt -c requirements.lock

      - name: Check the content passes after the undo
        id: check
        run: python tools/build.py --check

      - name: Save the undo
        id: save
        env:
          TARGET: ${{ steps.prepare.outputs.target }}
          GIT_PUSH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/undo.py commit --target "$TARGET"

      - name: Explain why nothing was undone
        if: failure() && steps.check.outcome == 'failure'
        run: |
          {
            echo "### Nothing was undone"
            echo
            echo "Without that change the content wouldn't pass the checks (below), so undoing it would stop the site from updating. Change it by hand in Pages CMS instead, or ask the developer."
            echo
            if [ -f build-report.md ]; then cat build-report.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: undo
    if: needs.undo.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    uses: ./.github/workflows/build-deploy.yml
    secrets: inherit
